name: Publier l'image Flowvent

# Image de Flowvent (app2) sur GHCR : `ghcr.io/<dépôt-owner>/flowvent`, tirée par les stacks
# Portainer release (test.flowvent.org) et prod (flowvent.org). Même principe que
# `publier-image.yml` pour app1 : la CI construit, l'hôte ne fait que tirer, et ce workflow ne
# déploie rien — le webhook Portainer reste une décision explicite.
#
# DEUX RÔLES, selon l'événement :
#
#   - sur une PR qui touche app2 OU le layer d'auth : construire SANS publier. C'est la garde qui
#     manquait : le layer `layers/auth` a évolué pour app1 pendant des mois en important des modules
#     qu'app2 n'avait pas, et app2 a cessé de se construire sans que rien ne le dise ;
#   - sur `main` (ou à la main) : construire et publier `:main` + `:sha-<commit>`.
#
# Les chemins filtrent : un lot qui ne touche qu'app1 ne reconstruit pas Flowvent.

on:
  push:
    branches: [main]
    paths:
      - 'apps/app2/**'
      - 'layers/core/**'
      - 'layers/auth/**'
      - '.github/workflows/publier-image-flowvent.yml'
  pull_request:
    paths:
      - 'apps/app2/**'
      - 'layers/core/**'
      - 'layers/auth/**'
      - '.github/workflows/publier-image-flowvent.yml'
  workflow_dispatch:

# Pas d'annulation sur `main` : un run interrompu laisserait `:main` sur une image plus ancienne.
# Sur une PR, un nouveau push rend l'ancien build inutile.
concurrency:
  group: publier-image-flowvent-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Se connecter à GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      # Contexte = racine du dépôt (app2 étend `layers/auth`) ; ce qui y entre est réglé par
      # `apps/app2/Dockerfile.dockerignore`.
      - name: Construire (et publier hors PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/app2/Dockerfile
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          # Nomme le répertoire des fichiers de build : `/_nuxt-<empreinte>/` (cf. nuxt.config.ts).
          # C'est ce que lit `/deploy-flowvent` pour prouver la bascule.
          build-args: |
            BUILD_SHA=${{ github.sha }}
          # Relie le paquet GHCR à ce dépôt (sans quoi il apparaît orphelin côté GitHub).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/flowvent:main
            ghcr.io/${{ github.repository_owner }}/flowvent:sha-${{ github.sha }}
          cache-from: type=gha,scope=flowvent
          cache-to: type=gha,mode=max,scope=flowvent

      - name: Rappeler ce qui vient d'être publié
        if: github.event_name != 'pull_request'
        run: |
          echo "Image publiée :"
          echo "  ghcr.io/${{ github.repository_owner }}/flowvent:main"
          echo "  ghcr.io/${{ github.repository_owner }}/flowvent:sha-${{ github.sha }}"
          echo ""
          echo "Rien n'est déployé pour autant : déclencher le webhook Portainer pour mettre en ligne."
