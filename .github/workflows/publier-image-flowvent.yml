name: Publier l'image Flowvent

# Image de Flowvent (app2) sur GHCR : `ghcr.io/<dépôt-owner>/flowvent`, tirée par les stacks
# Portainer release (test.flowvent.org) et prod (flowvent.org). Même principe que
# `publier-image.yml` pour app1 : la CI construit, l'hôte ne fait que tirer, et ce workflow ne
# déploie rien — le webhook Portainer reste une décision explicite.
#
# UN SEUL RÔLE : sur `main` (ou à la main), construire et publier `:main` + `:sha-<commit>`.
# Les chemins filtrent : un lot qui ne touche qu'app1 ne reconstruit pas Flowvent.
#
# ⚠️ La garde des PR n'est PLUS ici. Ce workflow construisait aussi l'image sans la publier sur
# chaque PR touchant app2 ou ses layers, mais hors du check requis `ci-verte` : une PR qui cassait
# Flowvent pouvait être mergée. Elle est devenue le job `image-flowvent` de `tests.yml`, qui compte
# dans le verdict et lit la liste des layers dans `extends` d'app2 au lieu de la recopier.

on:
  push:
    branches: [main]
    paths:
      - 'apps/app2/**'
      - 'layers/ui/**'
      - 'layers/core/**'
      - 'layers/volunteers/**'
      - 'layers/map/**'
      - 'layers/stock/**'
      - 'layers/artists/**'
      - 'layers/auth/**'
      - '.github/workflows/publier-image-flowvent.yml'
  workflow_dispatch:

# Pas d'annulation : un run interrompu laisserait `:main` sur une image plus ancienne.
concurrency:
  group: publier-image-flowvent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Se connecter à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v4

      # Contexte = racine du dépôt (app2 étend `layers/auth`) ; ce qui y entre est réglé par
      # `apps/app2/Dockerfile.dockerignore`.
      - name: Construire et publier
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/app2/Dockerfile
          target: runtime
          push: true
          # Nomme le répertoire des fichiers de build : `/_nuxt-<empreinte>/` (cf. nuxt.config.ts).
          # C'est ce que lit `/deploy-flowvent` pour prouver la bascule.
          build-args: |
            BUILD_SHA=${{ github.sha }}
          # Relie le paquet GHCR à ce dépôt (sans quoi il apparaît orphelin côté GitHub).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/flowvent:main
            ghcr.io/${{ github.repository_owner }}/flowvent:sha-${{ github.sha }}
          cache-from: type=gha,scope=flowvent
          cache-to: type=gha,mode=max,scope=flowvent

      - name: Rappeler ce qui vient d'être publié
        run: |
          echo "Image publiée :"
          echo "  ghcr.io/${{ github.repository_owner }}/flowvent:main"
          echo "  ghcr.io/${{ github.repository_owner }}/flowvent:sha-${{ github.sha }}"
          echo ""
          echo "Rien n'est déployé pour autant : déclencher le webhook Portainer pour mettre en ligne."
