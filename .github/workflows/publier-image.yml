name: Publier l'image

# Publication de l'image de production sur GHCR.
#
# Workflow à PART, et non un job de « CI Tests ». Il n'y partageait rien — ni `setup`, ni cache npm,
# ni `needs:` — mais il y brouillait deux choses. D'abord un run de « CI Tests » sur `main` voulait
# dire à la fois « les tests passent » et « l'image est publiée » : pour savoir si l'artefact
# existait, il fallait fouiller les jobs d'un run dont le nom parle d'autre chose. Ensuite il
# apparaissait en `skipping` sur chaque PR, et cette ligne a déjà fait conclure à tort qu'une image
# avait été publiée.
#
# Ici, la question est directe : `gh run list --workflow=publier-image.yml`.
#
# Pourquoi ce workflow existe : jusqu'au 12/09/2026, l'image déployée était construite PAR L'HÔTE de
# production, à partir d'un répertoire que Portainer mettait à jour en extrayant une archive du
# dépôt. Une extraction écrase ce qui a changé mais n'efface jamais ce qui a disparu — une page
# supprimée deux commits plus tôt était donc toujours construite et servie, et c'est l'ancien
# composant qui s'affichait en production. Trois conséquences, réglées d'un coup en construisant
# ailleurs :
#
#   1. les suppressions de fichiers redeviennent effectives (checkout neuf à chaque run) ;
#   2. la machine qui sert les utilisateurs ne construit plus rien — le build réclamait 8 Go de
#      tas Node, et son cache a déjà rempli le disque de l'hôte par le passé ;
#   3. ce qui tourne en production sort du même commit que les tests, au lieu d'être un second
#      build refait sur place et jamais exercé.
#
# Ce workflow ne DÉPLOIE rien : il publie. Le déploiement reste une décision explicite, déclenchée
# par le webhook Portainer.
#
# Pas de dépendance aux tests, et c'est délibéré : une image est un artefact, pas une mise en ligne.
# La publier tôt ne met rien en danger tant que le déploiement reste manuel, et la garde qui compte
# a déjà eu lieu — sur la PR, avant le merge.

on:
  push:
    branches: [main]
  # Republier sans pousser de commit : ce qu'on veut pouvoir faire quand une publication a échoué
  # sur une panne de registre, ou pour reconstruire une image perdue.
  workflow_dispatch:

# Pas d'annulation : un run interrompu laisserait `:main` sur une image plus ancienne que le dernier
# commit de la branche de référence, sans que rien ne le signale.
concurrency:
  group: publier-image
  cancel-in-progress: false

jobs:
  publier-image:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      # `context: .` — la racine du dépôt, comme le fait `docker-compose.prod.yml` (`context: ../..`)
      # depuis apps/app1 : le Dockerfile a besoin de `layers/` autant que de `apps/app1/`.
      #
      # Deux étiquettes, deux usages : `main` est celle que les stacks tirent, `sha-<commit complet>`
      # permet de désigner un build précis pour revenir en arrière sans reconstruire.
      #
      # Le cache `type=gha` rend les builds suivants courts sans jamais ressusciter de fichier : il
      # porte sur les couches, et une couche dont le contenu copié a changé est invalidée. C'est
      # exactement ce qui manquait à l'hôte, dont le répertoire source, lui, accumulait.
      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/app1/Dockerfile
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Rappeler ce qui vient d'être publié
        run: |
          echo "Image publiée :"
          echo "  ghcr.io/${{ github.repository }}:main"
          echo "  ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
          echo ""
          echo "Rien n'est déployé pour autant : déclencher le webhook Portainer pour mettre en ligne."
