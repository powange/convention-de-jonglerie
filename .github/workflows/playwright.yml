name: Playwright E2E Tests

on:
  # Sur les PR : ces tests couvrent des parcours que rien d'autre ne vérifie — import de carte,
  # trésorerie, droits d'organisateur. En déclenchement manuel, ils ne tournaient jamais, et
  # trois défauts d'affilée n'ont été détectés qu'à l'usage.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Même raison que dans tests.yml : un push sur une PR ouverte laissait le run précédent occuper la
# limite de 20 jobs simultanés alors que son résultat ne servait plus. Ce job-ci dure treize
# minutes, c'est donc lui qui immobilisait le plus longtemps un créneau pour rien.
#
# Jamais d'annulation sur un push vers main : un run interrompu laisserait un commit de la branche
# de référence sans vérification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  E2E_TEST: true
  DATABASE_URL: mysql://root:rootpassword@localhost:3306/convention_db_test
  NUXT_SESSION_PASSWORD: test_session_password_32_chars_minimum_here
  NUXT_PUBLIC_SITE_URL: http://localhost:3000
  SEND_EMAILS: false
  NUXT_RECAPTCHA_DEV_BYPASS: true
  # Secret de chiffrement (valeur de TEST uniquement) — requis par les endpoints qui chiffrent des
  # secrets côté serveur (config SumUp, billetterie externe HelloAsso/Infomaniak).
  ENCRYPTION_SECRET: test_encryption_secret_for_ci_e2e_only
  ENCRYPTION_SALT: test_encryption_salt_for_ci_e2e_only
  # Force les actions GitHub (checkout, cache, setup-node, upload-artifact)
  # à utiliser le runtime Node 24 (au lieu de Node 20 déprécié)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Monorepo : les commandes `run:` s'exécutent dans apps/app1. Les chemins des actions
# (`uses:` cache/upload, hashFiles) restent relatifs à la racine → préfixés apps/app1/.
#
# Attention : ce `defaults` ne s'applique PAS aux steps de `.github/actions/preparer-env`. Une
# action composite n'hérite pas du contexte de son appelant — chacun de ses steps `run:` porte donc
# son propre `working-directory`.
defaults:
  run:
    working-directory: apps/app1

jobs:
  playwright:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: convention_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Préparer l'environnement
        uses: ./.github/actions/preparer-env
        with:
          # Ce workflow n'a pas de job d'amorçage en amont : c'est lui qui écrit les caches quand
          # ils manquent. Les clés viennent de l'action, donc identiques à celles de tests.yml —
          # les deux workflows partagent une seule entrée au lieu d'en stocker deux copies, et cette
          # égalité ne repose plus sur un commentaire demandant de répercuter les changements.
          cache-mode: lire-ecrire
          # Ni prepare ni lien des layers : `nuxt build` reconstruit `.nuxt`, et le serveur lancé
          # ensuite est le bundle Nitro de `.output/`, où tout est déjà résolu.

      - name: Apply migrations and seed
        run: |
          npx prisma migrate deploy
          npm run db:seed:dev

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/app1/package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          ls -la .output/ || echo "ERROR: .output/ not found"
          ls -la .output/server/ || echo "ERROR: .output/server/ not found"

      - name: Start application
        run: |
          node .output/server/index.mjs > /tmp/nuxt-server.log 2>&1 &
          echo $! > /tmp/server.pid
          if ! npx wait-on http://localhost:3000 --timeout 60000; then
            echo "::error::Le serveur de production n'a pas répondu sur http://localhost:3000 dans le délai imparti"
            echo "===== Contenu de /tmp/nuxt-server.log ====="
            cat /tmp/nuxt-server.log || echo "(log serveur vide ou absent)"
            echo "===== Statut du process serveur ====="
            ps -p "$(cat /tmp/server.pid)" || echo "Le process serveur est mort (crash au démarrage)"
            exit 1
          fi

      - name: Run Playwright tests
        run: NUXT_SERVER_LOG=/tmp/nuxt-server.log npx playwright test

      - name: Dump server log on failure
        if: failure()
        run: |
          echo "===== Contenu de /tmp/nuxt-server.log ====="
          cat /tmp/nuxt-server.log || echo "(log serveur vide ou absent)"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            apps/app1/playwright-report/
            apps/app1/test-results/
          retention-days: 7
