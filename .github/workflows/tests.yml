name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Reporté de playwright.yml lors de sa fusion ici : c'était le seul des deux workflows à offrir
  # un déclenchement manuel, et la suite Playwright est justement celle qu'on veut parfois rejouer
  # seule, sans pousser de commit.
  workflow_dispatch:

# Chaque push sur une PR ouverte relançait les 9 checks en laissant les précédents aller au bout.
# Les minutes sont gratuites sur un dépôt public, mais la limite de 20 jobs simultanés du compte
# était occupée par des runs déjà périmés, et le dernier push — le seul qui compte — attendait
# derrière eux.
#
# L'annulation est conditionnée à l'événement, et c'est délibéré : sur un push vers main, un run
# interrompu laisserait un commit de la branche de référence sans vérification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Ici, le strict minimum réellement commun aux six jobs — un `env:` de workflow s'applique à tous,
# sans possibilité de le retirer ensuite.
#
# `NODE_ENV` n'y est PLUS, et c'est le point délicat de la fusion de playwright.yml dans ce fichier.
# Le serveur que Playwright démarre tournait jusqu'ici sans `NODE_ENV` du tout, playwright.yml ne le
# déclarant pas. Le laisser à `test` au niveau workflow aurait changé le comportement du serveur
# e2e : `cache-helpers.ts` teste `!== 'test'`, `prisma.ts` teste `'development'`, et surtout
# `csrf.ts` comme `impersonation-helpers.ts` posent leurs cookies avec
# `secure: NODE_ENV === 'production'` — un cookie `secure` ne serait pas renvoyé sur le HTTP de
# localhost. Chaque job porte donc son propre `NODE_ENV`, et le job `playwright` n'en a aucun.
env:
  DATABASE_URL: mysql://root:rootpassword@localhost:3306/convention_db_test
  # playwright.yml en déclarait une autre valeur (`..._32_chars_minimum_here`). Les deux sont
  # interchangeables : aucun code ne dépend du littéral, `server/plugins/validate-config.ts` exige
  # seulement 32 caractères au démarrage, et celle-ci en fait 34.
  NUXT_SESSION_PASSWORD: test_session_password_32_chars_min
  NUXT_PUBLIC_SITE_URL: http://localhost:3000
  # Désactiver les emails en test
  SEND_EMAILS: false
  # Bypass reCAPTCHA en test
  NUXT_RECAPTCHA_DEV_BYPASS: true
  # Force les actions GitHub (checkout, cache, setup-node, upload-artifact)
  # à utiliser le runtime Node 24 (au lieu de Node 20 déprécié)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Monorepo : les commandes `run:` s'exécutent dans apps/app1. Les chemins des actions
# (`uses:` cache/upload, hashFiles) restent relatifs à la racine → préfixés apps/app1/.
#
# Attention : ce `defaults` ne s'applique PAS aux steps de `.github/actions/preparer-env`. Une
# action composite n'hérite pas du contexte de son appelant — chacun de ses steps `run:` porte donc
# son propre `working-directory`.
defaults:
  run:
    working-directory: apps/app1

jobs:
  # Ce job n'existe que pour garantir aux cinq autres que les deux entrées de cache existent avant
  # qu'ils ne les lisent. Il ne prépare rien pour lui-même.
  setup:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Préparer l'environnement
        id: prep
        uses: ./.github/actions/preparer-env
        with:
          # Ce job gère ses caches lui-même, en dessous : il vérifie avant de télécharger, ce qu'un
          # `restaurer` ne sait pas faire. L'action ne lui sert donc qu'à poser Node et à calculer
          # les clés — les mêmes que celles des autres jobs, par construction.
          cache-mode: cles-seules

      # `lookup-only` vérifie qu'une entrée existe sans la télécharger. Avant, ce job décompressait
      # node_modules (~40 s) uniquement pour constater qu'il n'avait rien à faire — et les cinq
      # autres jobs attendaient ce job-là.
      - name: Vérifier le cache des dépendances
        id: verif-deps
        uses: actions/cache/restore@v4
        with:
          path: apps/app1/node_modules
          key: ${{ steps.prep.outputs.deps-cache-key }}
          lookup-only: true

      - name: Vérifier le cache du client Prisma
        id: verif-prisma
        uses: actions/cache/restore@v4
        with:
          path: apps/app1/server/generated/prisma
          key: ${{ steps.prep.outputs.prisma-cache-key }}
          lookup-only: true

      # Le client Prisma manque mais les dépendances sont en cache : il faut les télécharger pour de
      # vrai, `prisma generate` ayant besoin du CLI installé.
      - name: Restaurer les dépendances (client Prisma à régénérer)
        if: >-
          steps.verif-deps.outputs.cache-hit == 'true'
          && steps.verif-prisma.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: apps/app1/node_modules
          key: ${{ steps.prep.outputs.deps-cache-key }}

      - name: Installer les dépendances
        if: steps.verif-deps.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Générer le client Prisma
        if: steps.verif-prisma.outputs.cache-hit != 'true'
        run: npx prisma generate

      # ATTENTION — les deux `cache/save` ci-dessous sont la SEULE écriture de ces caches par ce
      # workflow. `lookup-only` n'ayant rien restauré, `actions/cache/restore` ne déclenche aucune
      # sauvegarde en post-job : c'est ici, explicitement, ou nulle part.
      #
      # Les supprimer ne ferait échouer aucun job. Les cinq consommateurs réinstallent sur cache
      # miss depuis #362, donc la CI resterait juste — simplement lente, à chaque run, sans que rien
      # ne le signale. C'est le seul endroit de ce fichier qui peut se dégrader en silence.
      #
      # Chaque `save` est conditionné par la négation exacte du `lookup` correspondant : toute
      # branche du job où une entrée manquait passe donc par son écriture. Les deux clés sont celles
      # de l'action, pas des valeurs recalculées ici, pour qu'on ne puisse pas écrire sous une clé
      # que personne ne lira.
      - name: Sauvegarder le cache des dépendances
        if: steps.verif-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/app1/node_modules
          key: ${{ steps.prep.outputs.deps-cache-key }}

      - name: Sauvegarder le cache du client Prisma
        if: steps.verif-prisma.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/app1/server/generated/prisma
          key: ${{ steps.prep.outputs.prisma-cache-key }}

  # Job pour le linting (rapide, pas besoin de DB)
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      NODE_ENV: test
    needs: setup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Préparer l'environnement
        uses: ./.github/actions/preparer-env
        with:
          # Le script `lint` ferait le prepare de lui-même (`[ -d .nuxt ] || npx nuxt prepare`),
          # mais un step nommé rend un échec de prepare lisible au lieu de le noyer dans la sortie
          # d'ESLint.
          preparer-nuxt: 'true'

      - name: Run linting
        run: npm run lint

      # Prettier n'a jamais tourné en CI : des lignes non formatées ont été mergées, et la
      # dérive ne se voyait qu'au prochain `npm run format` de quelqu'un d'autre, noyée parmi
      # ses propres modifications. Le contrôle coûte quelques secondes ici et rend le
      # formatage vérifiable au lieu d'être une habitude.
      - name: Check formatting
        run: npm run format:check

  # Job de vérification de types (vue-tsc) : attrape les variables/références non définies que
  # le build (esbuild, sans typecheck) et ESLint ne voient pas — ex. `edition is not defined`.
  typecheck:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      NODE_ENV: test
    needs: setup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Historique complet : le filet sur les fichiers modifiés compare la branche à sa base,
          # ce qu'une copie superficielle ne permet pas.
          fetch-depth: 0

      - name: Préparer l'environnement
        uses: ./.github/actions/preparer-env
        with:
          # Pas de `preparer-nuxt` : `nuxt typecheck` appelle lui-même `writeTypes` + `buildNuxt`
          # sans condition avant de lancer vue-tsc, donc un prepare explicite refait le même travail
          # pour une quinzaine de secondes. Son prepare interne a en plus l'avantage de tourner
          # après le lien des layers, donc avec leurs paquets résolus.
          #
          # Sans ce lien, les fichiers de `layers/` ne résoudraient aucun paquet et le compilateur y
          # dégraderait tous les types en `any` — un pan entier du code cesserait d'être vérifié
          # sans que rien ne devienne rouge.
          lier-layers: 'true'

      # Deux filets, et un seul journal.
      #
      # 1. Sur TOUT le dépôt : les "Cannot find name" (TS2304/TS2552), la classe des bugs
      #    `edition is not defined`. Le typecheck complet remonte des milliers d'erreurs
      #    préexistantes qu'on ne traite pas ici ; les gater toutes rendrait la CI rouge en
      #    permanence.
      # 2. Sur les SEULS fichiers que la branche modifie : les TS2345 (argument du mauvais type).
      #    La dette existante est ainsi gelée plutôt que soldée. Sans ce second filet, un objet
      #    passé là où un entier était attendu a atteint la production et renvoyé sept erreurs 500
      #    à un utilisateur — alors que `nuxt typecheck` le signalait déjà.
      - name: Typecheck — échoue sur les noms non définis (TS2304/TS2552)
        run: |
          npm run typecheck > typecheck.log 2>&1 || true
          if grep -qE "error TS(2304|2552)" typecheck.log; then
            echo "::error::Référence(s) à des noms non définis détectée(s) :"
            grep -E "error TS(2304|2552)" typecheck.log || true
            exit 1
          fi
          echo "✅ Aucune référence non définie (TS2304/TS2552)."

      # Le journal est conservé : sans lui, la dette de typage n'est mesurable que sur un poste
      # de développement, dont l'environnement diffère de celui-ci. Un `node_modules` à la racine
      # y existe par accident d'une installation ancienne — le `package.json` racine ne déclare
      # aucune dépendance — et les fichiers de `layers/` y résolvent leurs paquets, alors qu'ici
      # ils ne le peuvent pas. Deux comptages faits sur ces bases donnaient des ordres de grandeur
      # différents ; celui-ci fait foi.
      - name: Conserver le journal de typage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: apps/app1/typecheck.log
          retention-days: 14

      - name: Typecheck — échoue sur les erreurs de type des fichiers modifiés (TS2345)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > fichiers-modifies.txt
          echo "Fichiers modifiés par la branche :"
          cat fichiers-modifies.txt
          node scripts/typecheck-gate.mjs typecheck.log fichiers-modifies.txt 2345

  # Job pour valider que le build fonctionne
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # `test` et non `production` ici : avec `NODE_ENV=production`, le `npm ci` du filet de cache
    # sauterait les devDependencies, donc Nuxt lui-même. C'est le seul STEP de build qui passe en
    # production — voir son commentaire.
    env:
      NODE_ENV: test
    needs: setup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Préparer l'environnement
        uses: ./.github/actions/preparer-env
        with:
          # Toujours régénérer pour éviter les incohérences avec le cache des node_modules.
          prisma: toujours
          # Ni prepare ni lien des layers : `nuxt build` reconstruit `.nuxt`, et Vite comme Nitro
          # résolvent les paquets depuis le contexte de l'app, pas en remontant depuis `layers/`.

      # NE PAS remettre ce build sur le `NODE_ENV=test` des autres jobs, même si l'incohérence
      # apparente saute aux yeux.
      #
      # L'application était buildée DEUX FOIS par PR, et les deux builds différaient : celui-ci en
      # `test`, celui de playwright.yml en `production`. `nuxt.config.ts` lit `process.env.NODE_ENV`
      # au build à au moins six endroits — devtools, chargement de `@nuxt/test-utils/module`,
      # sourcemaps client, linkChecker, sitemap, ogImage, plus la CSP. Le job censé prouver « que le
      # build fonctionne » ne validait donc PAS la configuration qui part en production : une panne
      # propre à celle-ci — sitemap, images OG — n'était vue que par Playwright, ou par personne.
      #
      # Depuis, ce build est le seul du run, en configuration production, et Playwright le consomme
      # via l'artifact ci-dessous. Le repasser en `test` ferait silencieusement réapparaître l'angle
      # mort, sans qu'aucun test ne devienne rouge.
      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      # Le seul build du run, transmis au job `playwright`. `retention-days: 1` parce que c'est un
      # intermédiaire de run, pas un livrable : personne n'a de raison de le rouvrir le lendemain.
      #
      # `process.env.E2E_TEST` est lu à l'EXÉCUTION, pas inliné au build — vérifié dans un
      # `.output/` produit en CI, où les sept occurrences survivent littéralement
      # (`max: process.env.E2E_TEST === "true" ? 100 : 5`), alors que `import.meta.dev` a bien été
      # substitué. Cet artifact est donc un vrai build production, et non un build « parfumé e2e » :
      # c'est le job `playwright` qui porte `E2E_TEST`, au démarrage du serveur.
      - name: Publier le build pour le job playwright
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.run_id }}
          path: apps/app1/.output/
          retention-days: 1

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.run_id }}
          path: |
            apps/app1/.nuxt/
            apps/app1/.output/
          retention-days: 7

  # Tests en parallèle avec matrice
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
    # Seul `setup` est nécessaire : il amorce les caches (node_modules, client Prisma) que la
    # préparation ci-dessous restaure. Ni `lint` ni `build` ne produisent quoi que ce soit que les
    # tests consomment — vitest lit `.nuxt` via l'alias `#build` et ne touche jamais à `.output/`,
    # que seul le job `build` génère et qu'aucun cache ni artifact ne partage. Les attendre ne
    # faisait donc que sérialiser la CI : la matrice démarre désormais en même temps que
    # lint/typecheck/build, au lieu de leur ajouter leur durée en tête de chemin critique.
    # Contrepartie assumée : sur une branche dont le lint ou le build échoue, les quatre jobs de
    # tests tournent quand même — on paie quelques minutes de runner pour en gagner en attente.
    needs: [setup]

    strategy:
      fail-fast: false # Continue même si un test échoue
      matrix:
        test-group:
          - { name: 'unit', cmd: 'npm run test:unit:run', db: false }
          - { name: 'nuxt', cmd: 'npm run test:nuxt:run', db: false }
          - { name: 'e2e', cmd: 'npm run test:e2e:run', db: false }
          - { name: 'database', cmd: 'npm run test:db:run', db: true }

    services:
      mysql:
        image: ${{ matrix.test-group.db && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: convention_db_test
          MYSQL_USER: convention_user
          MYSQL_PASSWORD: convention_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Préparer l'environnement
        uses: ./.github/actions/preparer-env
        with:
          # vitest résout l'alias `#build` vers `.nuxt` et ne le génère jamais lui-même.
          preparer-nuxt: 'true'
          # Et sans le lien des layers, l'échec n'est pas une dégradation silencieuse des types mais
          # un échec franc : un fichier de `layers/` qui importe un paquet ne se résout pas du tout,
          # ce qui est arrivé au premier composable partagé qui en a importé un.
          lier-layers: 'true'

      - name: Setup database schema (DB tests only)
        if: matrix.test-group.db
        run: |
          # Reset la base complètement pour éviter les conflits de migration
          # Note: prisma/seed.ts est vide, donc pas de données de seed à charger
          npx prisma migrate reset --force

      - name: Run tests - ${{ matrix.test-group.name }}
        run: ${{ matrix.test-group.cmd }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test-group.name }}-${{ github.run_id }}
          path: |
            apps/app1/test-results/
            apps/app1/coverage/
            apps/app1/.nuxt/
          retention-days: 7

      - name: Upload coverage reports
        if: always() && (matrix.test-group.name == 'unit' || matrix.test-group.name == 'database')
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ matrix.test-group.name }}-${{ github.run_id }}
          path: apps/app1/coverage/
          retention-days: 30

  # Suite Playwright, rapatriée de playwright.yml — supprimé avec cette fusion. Elle couvre des
  # parcours que rien d'autre ne vérifie : import de carte, trésorerie, droits d'organisateur.
  #
  # Le nom du job reste `playwright`, à l'identique : c'est le nom du check, et le renommer
  # casserait silencieusement une règle de protection de branche qui l'exigerait.
  playwright:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # Ce job ne builde plus rien : il consomme le `.output/` du job `build`. Il démarre donc plus
    # tard qu'avant, où il partait à t=0 en parallèle de tout — le gain est en compute et en
    # justesse (un seul build, et c'est celui de production qui est testé), pas en horloge.
    needs: build

    # Ces trois variables n'existaient que dans playwright.yml et restent portées par ce seul job :
    # au niveau workflow elles toucheraient lint, typecheck, build et test, qui n'en ont que faire.
    #
    # `E2E_TEST` relève les limites de débit à 100 (`rate-limiter.ts`) et court-circuite l'envoi
    # d'invitations et d'emails. Elle doit être là au DÉMARRAGE du serveur, puisque le bundle la lit
    # à l'exécution — et non plus au build, qui se fait maintenant ailleurs.
    #
    # Pas de `NODE_ENV` : le serveur e2e tournait déjà sans, et plusieurs fichiers serveur changent
    # de comportement selon sa valeur. Voir le commentaire du bloc `env:` du workflow.
    env:
      E2E_TEST: true
      # Secret de chiffrement (valeur de TEST uniquement) — requis par les endpoints qui chiffrent
      # des secrets côté serveur (config SumUp, billetterie externe HelloAsso/Infomaniak). Lus à
      # l'exécution seulement (`server/utils/encryption.ts`), donc inutiles au job `build`.
      ENCRYPTION_SECRET: test_encryption_secret_for_ci_e2e_only
      ENCRYPTION_SALT: test_encryption_salt_for_ci_e2e_only

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: convention_db_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Préparer l'environnement
        uses: ./.github/actions/preparer-env
        with:
          # `restaurer` et non plus un mode écrivain : ce job dépend désormais de `build`, donc de
          # `setup`, qui a déjà amorcé les deux entrées. Quand playwright.yml était autonome il
          # devait les écrire lui-même ; le garder écrivain ici en ferait un second candidat à la
          # réservation de la même clé, ce qu'on a précisément supprimé en #362.
          #
          # Ni prepare ni lien des layers : ce job ne compile rien, il exécute le bundle de
          # `.output/`, où tout est déjà résolu.
          cache-mode: restaurer

      - name: Récupérer le build produit par le job build
        uses: actions/download-artifact@v4
        with:
          name: build-output-${{ github.run_id }}
          # Chemin relatif à la RACINE du dépôt, comme tous les chemins d'actions ici.
          path: apps/app1/.output

      # Les artifacts transitent par un zip, qui ne conserve ni les bits d'exécution ni les liens
      # symboliques. Ça ne gêne pas `node .output/server/index.mjs` — node lit le fichier, il ne
      # l'exécute pas — mais autant que l'absence du point d'entrée se voie ici plutôt que dans un
      # timeout de `wait-on` soixante secondes plus loin.
      - name: Vérifier le build téléchargé
        run: |
          ls -la .output/ || { echo "::error::.output/ absent après téléchargement"; exit 1; }
          test -f .output/server/index.mjs || { echo "::error::.output/server/index.mjs manquant"; exit 1; }
          echo "✅ point d'entrée présent : $(du -sh .output | cut -f1) de build récupéré"

      - name: Apply migrations and seed
        run: |
          npx prisma migrate deploy
          npm run db:seed:dev

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/app1/package-lock.json') }}

      # `--with-deps` inconditionnel, et c'est volontaire : sur cache chaud, Playwright saute de
      # lui-même le téléchargement (il teste `INSTALLATION_COMPLETE` dans le dossier du
      # navigateur), si bien que scinder ce step selon le cache ne gagnerait rien — tout son temps
      # part dans l'`apt-get` des dépendances système, que `install-deps` referait à l'identique —
      # tout en perdant la réparation automatique d'un cache restauré mais incomplet.
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start application
        run: |
          node .output/server/index.mjs > /tmp/nuxt-server.log 2>&1 &
          echo $! > /tmp/server.pid
          if ! npx wait-on http://localhost:3000 --timeout 60000; then
            echo "::error::Le serveur de production n'a pas répondu sur http://localhost:3000 dans le délai imparti"
            echo "===== Contenu de /tmp/nuxt-server.log ====="
            cat /tmp/nuxt-server.log || echo "(log serveur vide ou absent)"
            echo "===== Statut du process serveur ====="
            ps -p "$(cat /tmp/server.pid)" || echo "Le process serveur est mort (crash au démarrage)"
            exit 1
          fi

      - name: Run Playwright tests
        run: NUXT_SERVER_LOG=/tmp/nuxt-server.log npx playwright test

      - name: Dump server log on failure
        if: failure()
        run: |
          echo "===== Contenu de /tmp/nuxt-server.log ====="
          cat /tmp/nuxt-server.log || echo "(log serveur vide ou absent)"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            apps/app1/playwright-report/
            apps/app1/test-results/
          retention-days: 7
