name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Chaque push sur une PR ouverte relançait les 9 checks en laissant les précédents aller au bout.
# Les minutes sont gratuites sur un dépôt public, mais la limite de 20 jobs simultanés du compte
# était occupée par des runs déjà périmés, et le dernier push — le seul qui compte — attendait
# derrière eux.
#
# L'annulation est conditionnée à l'événement, et c'est délibéré : sur un push vers main, un run
# interrompu laisserait un commit de la branche de référence sans vérification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_ENV: test
  DATABASE_URL: mysql://root:rootpassword@localhost:3306/convention_db_test
  NUXT_SESSION_PASSWORD: test_session_password_32_chars_min
  NUXT_PUBLIC_SITE_URL: http://localhost:3000
  # Désactiver les emails en test
  SEND_EMAILS: false
  # Bypass reCAPTCHA en test
  NUXT_RECAPTCHA_DEV_BYPASS: true
  # Force les actions GitHub (checkout, cache, setup-node, upload-artifact)
  # à utiliser le runtime Node 24 (au lieu de Node 20 déprécié)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Monorepo : les commandes `run:` s'exécutent dans apps/app1. Les chemins des actions
# (`uses:` cache/upload, hashFiles) restent relatifs à la racine → préfixés apps/app1/.
defaults:
  run:
    working-directory: apps/app1

jobs:
  # Job pour installer les dépendances une seule fois
  setup:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      deps-cache-key: ${{ steps.cache-keys.outputs.deps }}
      prisma-cache-key: ${{ steps.cache-keys.outputs.prisma }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'apps/app1/package-lock.json'

      # Les clés sont identiques à celles de playwright.yml : les deux workflows installent le
      # même `node_modules` et génèrent le même client Prisma. Tant que chacun suivait sa propre
      # convention (`-deps-` ici, `-deps-v2-` là), une PR stockait tout en double — deux `npm ci`
      # complets au moindre changement de lockfile, et le quota de 10 Go par dépôt saturé deux
      # fois plus vite, dont les évictions LRU se manifestaient en cache miss apparemment
      # aléatoires. Toute modification de ces clés doit être répercutée dans l'autre fichier.
      #
      # Le marqueur passe à `-v3-` des deux côtés pour repartir d'entrées neuves : les anciennes
      # archivent aussi `~/.npm`, retiré ci-dessous, et une clé inchangée aurait continué de les
      # restaurer telles quelles — le gain de taille n'aurait pris effet qu'au prochain lockfile.
      - name: Generate cache keys
        id: cache-keys
        run: |
          echo "deps=${{ runner.os }}-deps-v3-${{ hashFiles('apps/app1/package-lock.json') }}" >> $GITHUB_OUTPUT
          echo "prisma=${{ runner.os }}-prisma-v3-${{ hashFiles('apps/app1/prisma/schema/**', 'apps/app1/prisma.config.ts') }}-${{ hashFiles('apps/app1/package-lock.json') }}" >> $GITHUB_OUTPUT

      # `~/.npm` n'est volontairement pas listé ici : `actions/setup-node` le met déjà en cache via
      # `cache: 'npm'` + `cache-dependency-path`, et comme `node_modules` est restauré tel quel,
      # npm ne relit jamais son cache. L'ajouter au chemin ne faisait que gonfler l'archive — donc
      # son temps de compression, d'upload et de download — dans les cinq jobs qui la restaurent.
      # Le cache de setup-node reste le filet des runs où `npm ci` doit réellement tourner.
      - name: Cache Node dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: apps/app1/node_modules
          key: ${{ steps.cache-keys.outputs.deps }}
          # Pas de restore-keys pour éviter les caches incompatibles avec le lockfile

      - name: Cache Prisma client
        id: cache-prisma
        uses: actions/cache@v4
        with:
          path: apps/app1/server/generated/prisma
          key: ${{ steps.cache-keys.outputs.prisma }}
          restore-keys: |
            ${{ runner.os }}-prisma-v3-

      # `.nuxt` n'est délibérément PAS mis en cache, et aucun job ne le transmet aux autres.
      #
      # Son contenu — types et déclarations d'auto-import — dérive de TOUT le code : composants,
      # composables, fichiers de `layers/`. La clé ne hachait que nuxt.config.ts, tsconfig.json et
      # app.config.ts : un commit qui ajoute un composable n'en touche aucun, donc un `.nuxt`
      # périmé était restauré et le `nuxi prepare` sauté. Le lint et les tests, qui lisent `.nuxt`
      # tel quel (alias `#build` pour vitest), travaillaient alors sur des déclarations absentes —
      # la même famille de panne que le bug des layers, et un échec d'autant plus déroutant qu'il
      # dépendait de l'âge d'une entrée de cache. `nuxi prepare` coûte une quinzaine de secondes,
      # soit à peu près ce que coûtaient la sauvegarde et la restauration de l'archive : on
      # échangeait un risque de faux résultat contre rien. Chaque job qui en a besoin le régénère.

      - name: Install dependencies (if not cached)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma client
        if: steps.cache-prisma.outputs.cache-hit != 'true'
        run: npx prisma generate

  # Job pour le linting (rapide, pas besoin de DB)
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: setup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'apps/app1/package-lock.json'

      # `actions/cache/restore` et non `actions/cache` : seul `setup` a vocation à écrire dans le
      # cache. `actions/cache` tente une sauvegarde en post-job dès que la clé a manqué, et depuis
      # que la matrice de tests tourne en parallèle de lint/build, six jobs pouvaient viser la même
      # clé en même temps — d'où les « Unable to reserve cache ». La variante `restore` ne
      # sauvegarde jamais.
      #
      # Et plus de `fail-on-cache-miss` : le quota de 10 Go par dépôt s'évince en LRU, donc
      # l'entrée peut disparaître entre la fin de `setup` et le démarrage de ce job. Ça rendait la
      # CI rouge pour une raison étrangère à la PR. On réinstalle au lieu d'échouer — c'est plus
      # lent ce jour-là, mais ça reste un résultat juste.
      - name: Restore Node dependencies
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: apps/app1/node_modules
          key: ${{ needs.setup.outputs.deps-cache-key }}

      - name: Réinstaller si le cache a disparu
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      # Même raison : ce job ne sauvegarde pas le client Prisma. Le step suivant est déjà le filet
      # du cache manquant, et c'est lui qui produisait le plus de courses à la sauvegarde — il n'a
      # jamais eu de `fail-on-cache-miss`, donc un miss laissait les six jobs réserver la clé.
      - name: Restore Prisma client
        id: cache-prisma
        uses: actions/cache/restore@v4
        with:
          path: apps/app1/server/generated/prisma
          key: ${{ needs.setup.outputs.prisma-cache-key }}

      - name: Generate Prisma Client (if cache miss)
        if: steps.cache-prisma.outputs.cache-hit != 'true'
        run: npx prisma generate

      # Régénéré à chaque run plutôt que restauré : voir le job `setup`. Le script `lint` le
      # ferait de lui-même (`[ -d .nuxt ] || npx nuxt prepare`), mais un step nommé rend un
      # échec de prepare lisible au lieu de le noyer dans la sortie d'ESLint.
      - name: Prepare Nuxt
        run: npx nuxi prepare

      - name: Run linting
        run: npm run lint

      # Prettier n'a jamais tourné en CI : des lignes non formatées ont été mergées, et la
      # dérive ne se voyait qu'au prochain `npm run format` de quelqu'un d'autre, noyée parmi
      # ses propres modifications. Le contrôle coûte quelques secondes ici et rend le
      # formatage vérifiable au lieu d'être une habitude.
      - name: Check formatting
        run: npm run format:check

  # Job de vérification de types (vue-tsc) : attrape les variables/références non définies que
  # le build (esbuild, sans typecheck) et ESLint ne voient pas — ex. `edition is not defined`.
  typecheck:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: setup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Historique complet : le filet sur les fichiers modifiés compare la branche à sa base,
          # ce qu'une copie superficielle ne permet pas.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'apps/app1/package-lock.json'

      # Restauration sans sauvegarde, et réinstallation plutôt qu'échec si l'entrée a été
      # évincée : voir le job `lint`.
      - name: Restore Node dependencies
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: apps/app1/node_modules
          key: ${{ needs.setup.outputs.deps-cache-key }}

      - name: Réinstaller si le cache a disparu
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Restore Prisma client
        id: cache-prisma
        uses: actions/cache/restore@v4
        with:
          path: apps/app1/server/generated/prisma
          key: ${{ needs.setup.outputs.prisma-cache-key }}

      - name: Generate Prisma Client (if cache miss)
        if: steps.cache-prisma.outputs.cache-hit != 'true'
        run: npx prisma generate

      # Pas de `nuxi prepare` ici : `nuxt typecheck` appelle lui-même `writeTypes` + `buildNuxt`
      # sans condition avant de lancer vue-tsc (@nuxt/cli, commande `typecheck`), donc un prepare
      # explicite refait exactement le même travail pour une quinzaine de secondes. Son prepare
      # interne a en plus l'avantage de tourner APRÈS le lien des layers ci-dessous, donc avec
      # leurs paquets résolus — ce qu'un prepare placé avant ne garantissait pas.

      # Dans le cas normal, ce job restaure `apps/app1/node_modules` depuis le cache sans rejouer
      # `npm ci` : le `postinstall` qui relie les dépendances aux layers ne s'exécute donc pas.
      # Sans ce rappel, les fichiers de `layers/` ne résoudraient aucun paquet et le compilateur y
      # dégraderait tous les types en `any` — un pan entier du code cesserait d'être vérifié. Il
      # reste utile même quand le filet de réinstallation ci-dessus a joué : l'appeler deux fois
      # ne coûte rien, alors que l'oublier une fois fait passer la vérification à côté.
      - name: Relier les dépendances aux layers
        run: node scripts/lier-layers-node-modules.mjs

      # Deux filets, et un seul journal.
      #
      # 1. Sur TOUT le dépôt : les "Cannot find name" (TS2304/TS2552), la classe des bugs
      #    `edition is not defined`. Le typecheck complet remonte des milliers d'erreurs
      #    préexistantes qu'on ne traite pas ici ; les gater toutes rendrait la CI rouge en
      #    permanence.
      # 2. Sur les SEULS fichiers que la branche modifie : les TS2345 (argument du mauvais type).
      #    La dette existante est ainsi gelée plutôt que soldée. Sans ce second filet, un objet
      #    passé là où un entier était attendu a atteint la production et renvoyé sept erreurs 500
      #    à un utilisateur — alors que `nuxt typecheck` le signalait déjà.
      - name: Typecheck — échoue sur les noms non définis (TS2304/TS2552)
        run: |
          npm run typecheck > typecheck.log 2>&1 || true
          if grep -qE "error TS(2304|2552)" typecheck.log; then
            echo "::error::Référence(s) à des noms non définis détectée(s) :"
            grep -E "error TS(2304|2552)" typecheck.log || true
            exit 1
          fi
          echo "✅ Aucune référence non définie (TS2304/TS2552)."

      # Le journal est conservé : sans lui, la dette de typage n'est mesurable que sur un poste
      # de développement, dont l'environnement diffère de celui-ci. Un `node_modules` à la racine
      # y existe par accident d'une installation ancienne — le `package.json` racine ne déclare
      # aucune dépendance — et les fichiers de `layers/` y résolvent leurs paquets, alors qu'ici
      # ils ne le peuvent pas. Deux comptages faits sur ces bases donnaient des ordres de grandeur
      # différents ; celui-ci fait foi.
      - name: Conserver le journal de typage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: apps/app1/typecheck.log
          retention-days: 14

      - name: Typecheck — échoue sur les erreurs de type des fichiers modifiés (TS2345)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > fichiers-modifies.txt
          echo "Fichiers modifiés par la branche :"
          cat fichiers-modifies.txt
          node scripts/typecheck-gate.mjs typecheck.log fichiers-modifies.txt 2345

  # Job pour valider que le build fonctionne
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: setup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'apps/app1/package-lock.json'

      # Restauration sans sauvegarde, et réinstallation plutôt qu'échec si l'entrée a été
      # évincée : voir le job `lint`.
      - name: Restore Node dependencies
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: apps/app1/node_modules
          key: ${{ needs.setup.outputs.deps-cache-key }}

      - name: Réinstaller si le cache a disparu
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Restore Prisma client
        id: cache-prisma
        uses: actions/cache/restore@v4
        with:
          path: apps/app1/server/generated/prisma
          key: ${{ needs.setup.outputs.prisma-cache-key }}

      - name: Generate Prisma Client
        # Toujours régénérer pour éviter les incohérences avec le cache des node_modules
        run: npx prisma generate

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.run_id }}
          path: |
            apps/app1/.nuxt/
            apps/app1/.output/
          retention-days: 7

  # Tests en parallèle avec matrice
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    # Seul `setup` est nécessaire : il amorce les caches (node_modules, client Prisma, .nuxt) que
    # les steps ci-dessous restaurent. Ni `lint` ni `build` ne produisent quoi que ce soit que les
    # tests consomment — vitest lit `.nuxt` via l'alias `#build` et ne touche jamais à `.output/`,
    # que seul le job `build` génère et qu'aucun cache ni artifact ne partage. Les attendre ne
    # faisait donc que sérialiser la CI : la matrice démarre désormais en même temps que
    # lint/typecheck/build, au lieu de leur ajouter leur durée en tête de chemin critique.
    # Contrepartie assumée : sur une branche dont le lint ou le build échoue, les quatre jobs de
    # tests tournent quand même — on paie quelques minutes de runner pour en gagner en attente.
    needs: [setup]

    strategy:
      fail-fast: false # Continue même si un test échoue
      matrix:
        test-group:
          - { name: 'unit', cmd: 'npm run test:unit:run', db: false }
          - { name: 'nuxt', cmd: 'npm run test:nuxt:run', db: false }
          - { name: 'e2e', cmd: 'npm run test:e2e:run', db: false }
          - { name: 'database', cmd: 'npm run test:db:run', db: true }

    services:
      mysql:
        image: ${{ matrix.test-group.db && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: convention_db_test
          MYSQL_USER: convention_user
          MYSQL_PASSWORD: convention_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'apps/app1/package-lock.json'

      # Restauration sans sauvegarde, et réinstallation plutôt qu'échec si l'entrée a été
      # évincée : voir le job `lint`.
      - name: Restore Node dependencies
        id: cache-deps
        uses: actions/cache/restore@v4
        with:
          path: apps/app1/node_modules
          key: ${{ needs.setup.outputs.deps-cache-key }}

      - name: Réinstaller si le cache a disparu
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit

      - name: Restore Prisma client
        id: cache-prisma
        uses: actions/cache/restore@v4
        with:
          path: apps/app1/server/generated/prisma
          key: ${{ needs.setup.outputs.prisma-cache-key }}

      - name: Generate Prisma Client (if cache miss)
        if: steps.cache-prisma.outputs.cache-hit != 'true'
        run: npx prisma generate

      # Régénéré à chaque run plutôt que restauré : voir le job `setup`. Indispensable ici, vitest
      # résout l'alias `#build` vers `.nuxt` et ne le génère jamais lui-même.
      - name: Prepare Nuxt
        run: npx nuxi prepare

      # Même rappel que dans le job de typage, et pour la même cause : dans le cas normal le cache
      # restaure `node_modules` sans rejouer `npm ci`, donc sans le `postinstall` qui lie les layers.
      # L'effet, ici, n'est pas la dégradation silencieuse des types mais un échec franc — un
      # fichier de `layers/` qui importe un paquet ne se résout pas du tout. Aucun util de layer
      # testé unitairement n'importait quoi que ce soit jusqu'au premier composable partagé.
      - name: Relier les dépendances aux layers
        run: node scripts/lier-layers-node-modules.mjs

      - name: Setup database schema (DB tests only)
        if: matrix.test-group.db
        run: |
          # Reset la base complètement pour éviter les conflits de migration
          # Note: prisma/seed.ts est vide, donc pas de données de seed à charger
          npx prisma migrate reset --force

      - name: Run tests - ${{ matrix.test-group.name }}
        run: ${{ matrix.test-group.cmd }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test-group.name }}-${{ github.run_id }}
          path: |
            apps/app1/test-results/
            apps/app1/coverage/
            apps/app1/.nuxt/
          retention-days: 7

      - name: Upload coverage reports
        if: always() && (matrix.test-group.name == 'unit' || matrix.test-group.name == 'database')
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports-${{ matrix.test-group.name }}-${{ github.run_id }}
          path: apps/app1/coverage/
          retention-days: 30
