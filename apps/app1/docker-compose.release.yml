# Docker Compose pour Convention de Jonglerie
services:
  # Base de données MySQL
  database:
    image: mysql:8.0
    container_name: convention-db-release
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-convention_db}
      MYSQL_USER: ${MYSQL_USER:-convention_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-convention_password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '3308:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '--silent']
      timeout: 2s
      interval: 3s
      retries: 15
      start_period: 5s

  # Application Nuxt.js
  app:
    # L'image est construite et publiée par la CI (job `publier-image` de tests.yml), plus par
    # cette machine. Trois raisons, dont une payée cher le 12/09/2026 :
    #
    #   - Portainer met à jour le répertoire de la stack en EXTRAYANT une archive du dépôt. Une
    #     extraction écrase ce qui a changé et n'efface jamais ce qui a disparu : une page supprimée
    #     deux commits plus tôt était toujours construite et servie, et c'est l'ancien composant qui
    #     s'affichait en production. En tirant une image, le contenu du répertoire ne décide plus de
    #     rien — seul ce fichier compte.
    #   - Le build réclamait 8 Go de tas Node sur la machine qui sert les utilisateurs, et son cache
    #     a déjà rempli son disque.
    #   - Ce qui tourne est désormais l'artefact issu du commit que la CI a testé, et non un second
    #     build refait sur place et jamais exercé.
    #
    # `pull_policy: always` n'est pas décoratif : sans lui, `docker compose up` réutilise l'image
    # locale déjà étiquetée `main` et le déploiement réussirait sans rien livrer — exactement le
    # silence qu'on cherche à supprimer.
    #
    # Pour revenir à un build précis sans reconstruire, remplacer `:main` par l'étiquette
    # `sha-<commit>` correspondante, que la CI publie aussi.
    image: ghcr.io/powange/convention-de-jonglerie:main
    pull_policy: always
    container_name: convention-app-release
    restart: unless-stopped
    # Charger les variables d'env depuis stack.env. Portainer l'écrit à la RACINE de la stack
    # (/data/compose/<id>/stack.env) ; le compose étant dans apps/app1/, on remonte de 2 niveaux.
    env_file:
      - ../../stack.env
    # Variables d'environnement spécifiques à Docker (peuvent override le .env)
    environment:
      # ⚠️ PLUS DE DATABASE_URL INTERPOLÉE ICI. Le mot de passe y était inséré TEL QUEL : un mot
      # de passe contenant « @ », « / », « : » ou « # » produisait une URL que `new URL()` découpe
      # de travers — avec « p@ss », le « @ » supplémentaire fait croire à un second séparateur
      # d'autorité, et l'hôte lu n'est plus le bon. L'application échouait au démarrage sans qu'aucun
      # message ne désigne la ponctuation du mot de passe.
      #
      # `docker/entrypoint.sh` construit désormais l'URL avec `encodeURIComponent`, depuis les
      # identifiants ci-dessous. Le mot de passe passe donc en CLAIR, dans une variable
      # d'environnement, et non interpolé dans une URL : sa ponctuation n'a plus aucune importance.
      #
      # ⚠️⚠️ LES IDENTIFIANTS SONT LISTÉS ICI EXPLICITEMENT, et c'est indispensable. `env_file`
      # ne suffit PAS : les variables d'une pile Portainer servent à INTERPOLER le compose
      # (`${MYSQL_USER}` ci-dessous), elles ne peuplent pas l'environnement du conteneur. Une
      # première version de ce lot l'avait supposé, et release a refusé de démarrer sur
      # « ERROR: DATABASE_URL is not set, and MYSQL_USER / MYSQL_PASSWORD are missing to build it ».
      # `entrypoint.sh` est en `set -e` : ce genre d'erreur n'est pas une dégradation, c'est un
      # conteneur qui ne se lance pas.
      MYSQL_USER: ${MYSQL_USER:-convention_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-convention_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-convention_db}
      DATABASE_HOST: 'database'
      # ⚠️ L'EMPREINTE DE SIGNATURE ANDROID, listée ici pour la MÊME raison que les identifiants
      # ci-dessus : une variable de pile Portainer interpole ce fichier, elle ne peuple pas
      # l'environnement du conteneur. Sans cette ligne, `/.well-known/assetlinks.json` rendrait un
      # tableau vide — et l'application du Play Store s'ouvrirait avec la barre d'adresse de
      # Chrome, sans qu'aucune erreur ne soit consignée nulle part.
      #
      # Vide tant que l'application n'a pas été déposée une première fois : l'empreinte à mettre
      # ici est celle de GOOGLE (Play App Signing), relevée dans la console Play après le premier
      # envoi. Cf. docs/publication-play-store-twa.md.
      ANDROID_SIGNING_FINGERPRINTS: '${ANDROID_SIGNING_FINGERPRINTS:-}'
      # Configuration Nuxt pour Docker
      NUXT_HOST: '0.0.0.0'
      NUXT_PORT: '3000'
      NODE_ENV: 'production'
      NUXT_ENV: 'release'
      # Lu à l'exécution par @nuxtjs/seo : toute valeur autre que `production` rend le site non
      # indexable — robots.txt en `Disallow: /`, X-Robots-Tag en `noindex`. Sans elle, release
      # servait trois signaux contradictoires : un robots.txt permissif, un en-tête `index, follow`
      # posé par le module, et une balise meta `noindex` posée par app.vue — seule la dernière
      # protégeait réellement. Ne surtout pas reporter cette ligne sur la production.
      NUXT_SITE_ENV: 'staging'
      # URL Ollama avec hostname Docker
      OLLAMA_BASE_URL: '${OLLAMA_BASE_URL:-http://ollama:11434}'
    volumes:
      - /home/powange/docker_workspaces/convention-de-jonglerie-release/backups:/app/apps/app1/backups
      - /home/powange/docker_workspaces/convention-de-jonglerie-release/uploads_data:/app/apps/app1/public/uploads
      - /home/powange/docker_workspaces/convention-de-jonglerie-release/uploads:/uploads
    depends_on:
      database:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local

networks:
  default:
    external: true
    name: proxy-network
