# Docker Compose pour Convention de Jonglerie
services:
  # Base de données MySQL
  database-prod:
    image: mysql:8.0
    container_name: convention-db-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-convention_db}
      MYSQL_USER: ${MYSQL_USER:-convention_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-convention_password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '3309:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 2s
      interval: 3s
      retries: 15
      start_period: 5s

  # Application Nuxt.js
  app-prod:
    # L'image est construite et publiée par la CI (job `publier-image` de tests.yml), plus par
    # cette machine. Trois raisons, dont une payée cher le 12/09/2026 :
    #
    #   - Portainer met à jour le répertoire de la stack en EXTRAYANT une archive du dépôt. Une
    #     extraction écrase ce qui a changé et n'efface jamais ce qui a disparu : une page supprimée
    #     deux commits plus tôt était toujours construite et servie, et c'est l'ancien composant qui
    #     s'affichait en production. En tirant une image, le contenu du répertoire ne décide plus de
    #     rien — seul ce fichier compte.
    #   - Le build réclamait 8 Go de tas Node sur la machine qui sert les utilisateurs, et son cache
    #     a déjà rempli son disque.
    #   - Ce qui tourne est désormais l'artefact issu du commit que la CI a testé, et non un second
    #     build refait sur place et jamais exercé.
    #
    # `pull_policy: always` n'est pas décoratif : sans lui, `docker compose up` réutilise l'image
    # locale déjà étiquetée `main` et le déploiement réussirait sans rien livrer — exactement le
    # silence qu'on cherche à supprimer.
    #
    # Pour revenir à un build précis sans reconstruire, remplacer `:main` par l'étiquette
    # `sha-<commit>` correspondante, que la CI publie aussi.
    image: ghcr.io/powange/convention-de-jonglerie:main
    pull_policy: always
    container_name: convention-app-prod
    restart: unless-stopped
    # Charger les variables d'env depuis stack.env. Portainer l'écrit à la RACINE de la stack
    # (/data/compose/<id>/stack.env) ; le compose étant dans apps/app1/, on remonte de 2 niveaux.
    env_file:
      - ../../stack.env
    # Variables d'environnement spécifiques à Docker (peuvent override le .env)
    environment:
      # Database URL avec le hostname Docker
      DATABASE_URL: 'mysql://${MYSQL_USER:-convention_user}:${MYSQL_PASSWORD:-convention_password}@database-prod:3306/${MYSQL_DATABASE:-convention_db}'
      # Configuration Nuxt pour Docker
      NUXT_HOST: '0.0.0.0'
      NUXT_PORT: '3000'
      NODE_ENV: 'production'
      # URL Ollama avec hostname Docker
      OLLAMA_BASE_URL: '${OLLAMA_BASE_URL:-http://ollama:11434}'
    volumes:
      - /home/powange/docker_workspaces/convention-de-jonglerie-prod/backups:/app/apps/app1/backups
      - /home/powange/docker_workspaces/convention-de-jonglerie-prod/uploads_data:/app/apps/app1/public/uploads
      - /home/powange/docker_workspaces/convention-de-jonglerie-prod/uploads:/uploads
    depends_on:
      database-prod:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local

networks:
  default:
    external: true
    name: proxy-network
