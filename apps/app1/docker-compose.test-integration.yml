# Docker Compose pour les tests d'intégration avec base de données
version: '3.8'

# ⚠️ `name:` DISTINCT DE CELUI DU DÉVELOPPEMENT, et c'est la correction la plus importante de ce
# fichier. Le nom de projet PRÉFIXE les volumes : avec `convention-de-jonglerie`, le volume
# `node_modules` déclaré plus bas résolvait `convention-de-jonglerie_node_modules`, c'est-à-dire
# CELUI DU CONTENEUR DE DÉVELOPPEMENT. Les tests montaient donc son installation, et les scripts
# `*:clean` (`down -v`) l'auraient SUPPRIMÉE. Même cause que la destruction de la base de dev par
# docker-compose.test.yml : un nom de projet partagé.
name: convention-de-jonglerie-test
services:
  # Base de données MySQL pour les tests
  test-db:
    image: mysql:8.0
    container_name: convention-test-db
    environment:
      MYSQL_ROOT_PASSWORD: test_root_password
      MYSQL_DATABASE: test_convention_db
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
    ports:
      # 3308 est le port de la base MIROIR du développement : le publier ici empêchait les deux
      # piles de tourner ensemble. 3307 est pris par un autre projet de la machine.
      - '3311:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 20s
      retries: 10
      interval: 5s
    networks:
      - test-network

  # Container pour les tests d'intégration avec DB
  test-integration:
    build:
      context: ../..
      dockerfile: apps/app1/Dockerfile.test
      args:
        BASE_NODE_IMAGE: ${BASE_NODE_IMAGE-node:24-slim}
    container_name: convention-test-integration
    environment:
      DATABASE_URL: 'mysql://test_user:test_password@test-db:3306/test_convention_db'
      TEST_DATABASE_URL: 'mysql://test_user:test_password@test-db:3306/test_convention_db'
      NUXT_HOST: '0.0.0.0'
      NUXT_PORT: '3000'
      NODE_ENV: 'test'
      TEST_WITH_DB: 'true'
      CI: 'true'
      SEND_EMAILS: 'false'
    volumes:
      - ./app:/app/apps/app1/app:cached
      - ../../layers:/app/layers:cached
      - ./server:/app/apps/app1/server:cached
      - ./shared:/app/apps/app1/shared:cached
      - ./test:/app/apps/app1/test:cached
      - ./scripts:/app/apps/app1/scripts:cached
      - ./prisma:/app/apps/app1/prisma:cached
      - ./public:/app/apps/app1/public:cached
      - ./nuxt.config.ts:/app/apps/app1/nuxt.config.ts:cached
      - node_modules:/app/apps/app1/node_modules
      - nuxt_cache:/app/apps/app1/.nuxt
      - output_cache:/app/apps/app1/.output
    depends_on:
      test-db:
        condition: service_healthy
    networks:
      - test-network
    command: sh scripts/run-integration-tests-docker.sh

volumes:
  node_modules:
    driver: local
  nuxt_cache:
    driver: local
  output_cache:
    driver: local

networks:
  test-network:
    driver: bridge
