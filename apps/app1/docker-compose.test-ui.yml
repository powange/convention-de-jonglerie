# Docker Compose pour Vitest UI uniquement
version: '3.8'

# ⚠️ `name:` DISTINCT DE CELUI DU DÉVELOPPEMENT, et c'est la correction la plus importante de ce
# fichier. Le nom de projet PRÉFIXE les volumes : avec `convention-de-jonglerie`, le volume
# `node_modules` déclaré plus bas résolvait `convention-de-jonglerie_node_modules`, c'est-à-dire
# CELUI DU CONTENEUR DE DÉVELOPPEMENT. Les tests montaient donc son installation, et les scripts
# `*:clean` (`down -v`) l'auraient SUPPRIMÉE. Même cause que la destruction de la base de dev par
# docker-compose.test.yml : un nom de projet partagé.
name: convention-de-jonglerie-test
services:
  # Container pour Vitest UI
  test-ui:
    build:
      context: ../..
      dockerfile: apps/app1/Dockerfile.test
    container_name: convention-test-ui
    environment:
      NODE_ENV: 'test'
      CI: 'false'
    volumes:
      - ./app:/app/apps/app1/app:cached
      - ../../layers:/app/layers:cached
      - ./server:/app/apps/app1/server:cached
      - ./shared:/app/apps/app1/shared:cached
      - ./test:/app/apps/app1/test:cached
      - ./scripts:/app/apps/app1/scripts:cached
      - ./prisma:/app/apps/app1/prisma:cached
      - ./public:/app/apps/app1/public:cached
      - ./nuxt.config.ts:/app/apps/app1/nuxt.config.ts:cached
      - ./vitest.config.ts:/app/apps/app1/vitest.config.ts:cached
      - node_modules:/app/apps/app1/node_modules
    ports:
      - '5173:5173'
    stdin_open: true
    tty: true
    command:
      - sh
      - -c
      - |
        mkdir -p /app/apps/app1/public/uploads
        if [ ! -x node_modules/.bin/vitest ]; then
          echo "node_modules absent: installation des dépendances..."
          npm ci
        fi
        npx vitest --ui --project unit

volumes:
  node_modules:
    driver: local
