# Flowvent (app2) — RELEASE. Domaine : https://test.flowvent.org
#
# Stack Portainer : dépôt Git, compose path = apps/app2/docker-compose.release.yml.
# Le reverse proxy (réseau externe `proxy-network`) doit viser `flowvent-app-release:3000`.
#
# Variables de la stack (onglet « Environment variables » de Portainer) :
#   obligatoires : NUXT_PUBLIC_SITE_URL (https://test.flowvent.org), NUXT_SESSION_PASSWORD (>= 32 caractères), MYSQL_PASSWORD, MYSQL_ROOT_PASSWORD
#   optionnelles : MYSQL_USER, MYSQL_DATABASE, NUXT_OAUTH_GOOGLE_CLIENT_ID/SECRET,
#                  NUXT_OAUTH_FACEBOOK_CLIENT_ID/SECRET,
#                  SEND_EMAILS (true pour envoyer), SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS,
#                  SMTP_FROM (expéditeur), SMTP_BCC (copie d'archivage)
#
# ⚠️ Une variable de stack Portainer sert à INTERPOLER ce fichier ; elle ne peuple pas
# l'environnement du conteneur. Chaque variable lue par l'application est donc listée sous
# `environment:` ci-dessous — l'oublier, c'est la voir absente au démarrage (vécu sur app1).
name: flowvent-release
services:
  flowvent-db-release:
    image: mysql:8.0
    container_name: flowvent-db-release
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definir MYSQL_ROOT_PASSWORD dans la stack}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flowvent_db}
      MYSQL_USER: ${MYSQL_USER:-flowvent_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Definir MYSQL_PASSWORD dans la stack}
    volumes:
      - mysql_data:/var/lib/mysql
    # Aucun port publié : l'app joint la base par le réseau Docker. Un port publié sans adresse
    # serait ouvert sur 0.0.0.0, et ufw ne le filtrerait pas (cf. apps/app1/docker-compose.prod.yml).
    # Débogage ponctuel : `docker exec -it flowvent-db-release mysql -uflowvent_user -p`
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
      timeout: 2s
      interval: 3s
      retries: 15
      start_period: 5s

  flowvent-app-release:
    # Image construite et publiée par la CI (.github/workflows/publier-image-flowvent.yml), jamais
    # par l'hôte — mêmes raisons qu'app1 : Portainer met à jour le dossier de la stack en extrayant
    # une archive, qui n'efface pas les fichiers supprimés ; et le build ne doit pas peser sur la
    # machine qui sert les utilisateurs.
    #
    # `pull_policy: always` est indispensable : sans lui, le redéploiement réutiliserait l'image
    # locale déjà étiquetée `main` et ne livrerait rien. Pour revenir en arrière, remplacer
    # `:main` par `:sha-<commit>`.
    image: ghcr.io/powange/flowvent:main
    pull_policy: always
    container_name: flowvent-app-release
    restart: unless-stopped
    environment:
      # L'entrypoint construit DATABASE_URL à partir de ces valeurs (mot de passe encodé).
      MYSQL_USER: ${MYSQL_USER:-flowvent_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flowvent_db}
      DATABASE_HOST: 'flowvent-db-release'
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?Definir NUXT_SESSION_PASSWORD (>= 32 caracteres) dans la stack}
      # Domaine de l'environnement (liens des courriels) — variable de stack, comme app1.
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:?Definir NUXT_PUBLIC_SITE_URL (https://test.flowvent.org) dans la stack}
      # OAuth Google et Facebook. Sans identifiants, le bouton reste affiché et renvoie sur /login.
      # Les URL de retour sont dérivées du domaine, et non de la requête : derrière le proxy, la
      # requête pourrait se présenter en http et le fournisseur refuserait l'URL. À déclarer telles
      # quelles chez Google (« URI de redirection autorisés ») et chez Meta (« URI de redirection
      # OAuth valides ») : <NUXT_PUBLIC_SITE_URL>/auth/google et <NUXT_PUBLIC_SITE_URL>/auth/facebook.
      NUXT_OAUTH_GOOGLE_CLIENT_ID: ${NUXT_OAUTH_GOOGLE_CLIENT_ID:-}
      NUXT_OAUTH_GOOGLE_CLIENT_SECRET: ${NUXT_OAUTH_GOOGLE_CLIENT_SECRET:-}
      NUXT_OAUTH_GOOGLE_REDIRECT_URL: ${NUXT_PUBLIC_SITE_URL}/auth/google
      NUXT_OAUTH_FACEBOOK_CLIENT_ID: ${NUXT_OAUTH_FACEBOOK_CLIENT_ID:-}
      NUXT_OAUTH_FACEBOOK_CLIENT_SECRET: ${NUXT_OAUTH_FACEBOOK_CLIENT_SECRET:-}
      NUXT_OAUTH_FACEBOOK_REDIRECT_URL: ${NUXT_PUBLIC_SITE_URL}/auth/facebook
      # Courriels : simulés (écrits dans les journaux) tant que SEND_EMAILS n'est pas `true`.
      # Pour les envoyer, renseigner dans la stack SEND_EMAILS=true et le serveur SMTP. Rien ne
      # part vers un domaine de test (`.test`, `example.com`…). Cf. docs/deploiement-flowvent.md.
      SEND_EMAILS: ${SEND_EMAILS:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_BCC: ${SMTP_BCC:-}
      NUXT_HOST: '0.0.0.0'
      NUXT_PORT: '3000'
      NODE_ENV: 'production'
      NUXT_ENV: 'release'
      # Photos de profil déposées : sur le volume ci-dessous, qui survit aux redéploiements.
      NUXT_FILE_STORAGE_MOUNT: '/uploads'
    volumes:
      - uploads_data:/uploads
      # Sauvegardes de la base faites depuis l'administration (layer backup) : elles doivent
      # survivre aux redéploiements, comme les fichiers déposés.
      - backups_data:/app/apps/app2/backups
    depends_on:
      flowvent-db-release:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
  # Photos de profil déposées (montées en /uploads dans l'app).
  uploads_data:
    driver: local
  # Sauvegardes de la base (montées dans l'app, cf. ci-dessus).
  backups_data:
    driver: local

networks:
  default:
    external: true
    name: proxy-network
